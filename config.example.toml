provider = "deepseek"
model = "deepseek-v4-pro"

# Tool-call approval policy (default "on-request"). One of:
# on-request | suggest | untrusted | auto | never | never-ask | yolo.
approval_policy = "on-request"

# Filesystem sandbox for shell/exec tools (default "workspace-write"). One of:
# workspace-write | read-only | danger-full-access | external-sandbox.
# When unset, the sandbox is derived from approval_policy.
sandbox_mode = "workspace-write"

# Master switch for the shell tool (default true).
allow_shell = true

# Skill install dir and MCP server config file (defaults shown).
# skills_dir = ".deepseek/skills"
# mcp_config_path = ".deepseek/mcp.json"

# Web search: AnySearch (optional key) + Tavily (optional key); results are merged.
# anysearch_api_key = ""   # or ANYSEARCH_API_KEY
# tavily_api_key = ""      # or TAVILY_API_KEY

[providers.deepseek]
base_url = "https://api.deepseek.com"
timeout = 120

# Custom OpenAI-compatible provider example. Models the built-in table
# doesn't recognize default to a 500K context window; set context_window
# to the model's real limit to override (e.g. 1000000 for a 1M model).
# [providers.my-provider]
# protocol = "openai"
# base_url = "https://api.example.com/v1"
# api_key = "sk-..."
# model = "glm-5.2"
# context_window = 1000000
#
# Multi-model endpoints can set a window per model (the Workbench settings
# UI writes this table automatically):
# [providers.my-provider.context_windows]
# "glm-5.2" = 1000000
# "glm-5.2-air" = 500000

[ui]
color_scheme = "default"
show_thinking = true
# Reply + UI language: "zh" (default) or "en". Workbench Settings syncs this.
locale = "zh"

[state]
database_path = "~/.deepseek_tui/state.db"
autosave = true

[features]
shell_tool = true    # shell/exec tool (default true)
subagents = true     # sub-agent spawn tools (default true)
tasks = true
web_search = true    # AnySearch/Tavily web search tool (default true)
mcp = true           # MCP servers from mcp_config_path (default true)
exec_policy = true   # exec policy engine (default true)
# Opt-in (default false): durable scheduled automations — registers the 8
# automation tools + scheduler; has side effects, so enable deliberately.
automations = true
plugins = true       # plugin system: skills/hooks/MCP bundles (default true)

[subagents]
# Per-type model overrides. When a sub-agent of the given type is spawned
# without an explicit ``model``, this is used; otherwise the spawn falls back
# to ``default_model`` then the global ``default_text_model``.
# default_model = "deepseek-chat"
# explorer_model = "deepseek-chat"     # explore / plan
# worker_model = "deepseek-chat"       # implementer / verifier
# review_model = "deepseek-chat"       # review
# custom_model = "deepseek-chat"       # custom
# Per-type override map (keyed by type name) wins over the fields above.
# models = { explore = "deepseek-chat" }
# Max sub-agent LLM streams in flight at once (0 disables the gate).
llm_max_concurrent = 2
# Seconds the parent turn blocks waiting for direct (non-background)
# sub-agents before timing out the handoff.
handoff_timeout_secs = 600

[post_turn]
enabled = true

[evolution]
enabled = false
mode = "suggest"
review_model = ""
review_max_steps = 8
flush_min_user_turns = 6
flush_timeout_s = 30.0
notify = true

[evolution.curated]
enabled = true
# dir = ""  # default ~/.deepseek/memories
memory_char_limit = 2200
user_char_limit = 1375

[evolution.procedural]
enabled = true
default_scope = "project"

[evolution.schedulers]
memory_nudge_every_n = 10
skill_nudge_tool_rounds = 10
review_idle_timeout_seconds = 600
min_tool_calls_signal = 5

[evolution.ledger]
enabled = true
retain_days = 90
memory_curate = "auto"
skill_patch = "auto"
skill_create = "propose"

[evolution.sinks]
trajectory_enabled = false
# trajectory_path = "~/.deepseek/trajectories"

# Observability sinks + lifecycle hooks (all optional; defaults shown).
[hooks]
enabled = true
# stdout = false                          # echo hook events to stdout as JSON
# jsonl_path = ".deepseek/hooks.jsonl"    # append events to a JSONL file
# webhook_urls = ["https://example.com/hook"]
# default_timeout_secs = 30.0             # overrides the 30s per-hook default

# Lifecycle hooks run a shell command at engine lifecycle points. Events:
# session_start | session_end | message_submit | tool_call_before |
# tool_call_after | mode_change | on_error | shell_env
# [[hooks.hooks]]
# event = "tool_call_after"
# command = "./scripts/on-tool-call.sh"
# name = "log-tool-calls"
# timeout_secs = 30.0        # default 30
# background = false         # default false
# continue_on_error = true   # default true

# Baidu hot search → email (see scripts/run-baidu-hotsearch-once.sh)
[automation]
mail_to = "you@example.com"

[automation.email]
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_starttls = true
username = "you@example.com"
from_addr = "you@example.com"
password_env = "DEEPSEEK_EMAIL_PASSWORD"
