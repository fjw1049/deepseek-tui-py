<!doctype html><html><head><meta charset="utf-8"><title>Sign up</title><script src="bench.js"></script></head><body>
<h1>Create account</h1>
<form id="f">
<label>Full name <input name="name" required></label><br>
<label>Email <input name="email" type="email" required></label><br>
<label>Plan <select name="plan"><option value="free">Free</option><option value="team">Team</option><option value="enterprise">Enterprise</option></select></label><br>
<label><input type="checkbox" name="newsletter"> Subscribe to newsletter</label><br>
<button type="submit">Create account</button>
</form><p id="done"></p>
<script>
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault(); const d = new FormData(e.target);
  report('submit', {name: d.get('name'), email: d.get('email'), plan: d.get('plan'), newsletter: d.get('newsletter') === 'on'});
  document.getElementById('done').textContent = 'Account created for ' + d.get('email');
});
</script></body></html>
