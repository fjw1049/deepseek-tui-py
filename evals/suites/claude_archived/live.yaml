        \ | None = None,\n    system_prompt: str | None = None,\n    tools: list[dict[str,\
        \ Any]] | None = None,\n    pressure: Any | None = None,\n    model_config:\
        \ object | None = None,\n) -> bool:\n    \"\"\"True when context ratio warrants\
