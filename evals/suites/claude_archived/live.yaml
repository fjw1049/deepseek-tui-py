      engine/capacity.py: "\"\"\"Context compaction for long conversations.\n\nConsolidates\
        \ capacity.py, capacity_flow.py, compaction.py: ratio-based\ncompaction planning,\
        \ summary creation, and L0 tool-result pruning.\n\"\"\"\n\nfrom __future__\
        \ import annotations\n\nimport asyncio\nimport logging\nimport re\nfrom dataclasses\
        \ import dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\
        \nfrom deepseek_tui.client.base import LLMClient\nfrom deepseek_tui.protocol.messages\
        \ import Message, MessageRequest\n\nlogger = logging.getLogger(__name__)\n\
        \n# Configuration constants\nKEEP_RECENT_MESSAGES = 4\nKEEP_RECENT_TOKENS\
        \ = 20_000\nMIN_SUMMARIZE_MESSAGES = 6\nMAX_WORKING_SET_PATHS = 24\nSUMMARY_TEXT_SNIPPET_CHARS\
        \ = 800\nSUMMARY_TOOL_RESULT_SNIPPET_CHARS = 240\nSUMMARY_INPUT_MAX_CHARS\
        \ = 24_000\nSUMMARY_INPUT_HEAD_CHARS = 14_000\nSUMMARY_INPUT_TAIL_CHARS =\
        \ 6_000\nLARGE_CONTEXT_SUMMARY_TEXT_SNIPPET_CHARS = 2_000\nLARGE_CONTEXT_SUMMARY_TOOL_RESULT_SNIPPET_CHARS\
        \ = 4_000\nLARGE_CONTEXT_SUMMARY_INPUT_MAX_CHARS = 120_000\nLARGE_CONTEXT_SUMMARY_INPUT_HEAD_CHARS\
        \ = 72_000\nLARGE_CONTEXT_SUMMARY_INPUT_TAIL_CHARS = 36_000\nLARGE_CONTEXT_SUMMARY_MAX_TOKENS\
        \ = 2_048\nLARGE_CONTEXT_WINDOW_TOKENS = 500_000\n\n# L0 mid-session tool-result\
        \ prune (grok-style).\nL0_KEEP_LAST_N_TURNS = 5\nL0_SOFT_TRIM_THRESHOLD =\
        \ 4_000\nL0_SOFT_TRIM_HEAD = 1_500\nL0_SOFT_TRIM_TAIL = 1_500\nL0_HARD_CLEAR_AGE_TURNS\
        \ = 15\n# Default hard-clear body when no spillover path is recoverable. Prefer\n\
        # ``format_hard_clear_placeholder`` so spilled outputs keep a re-read pointer.\n\
        L0_HARD_CLEAR_PLACEHOLDER = \"[Tool result omitted — too old]\"\n# Minimum\
        \ chars a hard-clear pass must reclaim before it may run.\n#\n# A clear rewrites\
        \ bodies that already sit in the provider's KV prefix, so the\n# next request\
        \ re-bills everything from that point at full price. Ages tick per\n# user\
        \ turn, so without a floor a single newly-aged result is enough to break\n\
        # the prefix every turn. Measured on a 25-turn tool-heavy session: clearing\n\
        # every turn held the cacheable prefix at ~27%; batching until this much is\n\
        # reclaimable lifted it to ~58% for ~7% more average payload, cutting effective\n\
        # input billing by roughly a third. Waiting costs nothing permanent — the\n\
        # bodies stay soft-trimmed and get cleared in one batch later.\nL0_HARD_CLEAR_MIN_RECLAIM\
        \ = 16_000\n\n\n@dataclass\nclass CompactionConfig:\n    \"\"\"Ratio-based\
        \ conversation compaction policy (relative to model window).\"\"\"\n\n   \
        \ enabled: bool = True\n    model: str | None = None  # None = inherit main\
        \ model\n    auto_floor_ratio: float = 0.20\n    rewrite_ratio: float = 0.75\n\
        \    keep_recent_tokens: int = KEEP_RECENT_TOKENS\n    l0_prune_ratio: float\
        \ = 0.50\n    l0_prune_enabled: bool = True\n\n\n@dataclass\nclass ToolPruneConfig:\n\
        \    \"\"\"Deterministic mid-session pruning of old tool result bodies.\"\"\
        \"\n\n    enabled: bool = True\n    trigger_ratio: float = 0.50\n    keep_last_n_turns:\
        \ int = L0_KEEP_LAST_N_TURNS\n    soft_trim_threshold: int = L0_SOFT_TRIM_THRESHOLD\n\
        \    soft_trim_head: int = L0_SOFT_TRIM_HEAD\n    soft_trim_tail: int = L0_SOFT_TRIM_TAIL\n\
        \    hard_clear_age_turns: int = L0_HARD_CLEAR_AGE_TURNS\n    # 0 = clear\
        \ as soon as a body is old enough. Above 0, defer the clear until\n    # the\
        \ whole eligible batch reclaims this many chars, so the prefix break is\n\
        \    # paid once per batch instead of once per turn.\n    hard_clear_min_reclaim:\
        \ int = 0\n\n\n@dataclass\nclass SummaryInputLimits:\n    \"\"\"Input limits\
        \ for summary based on model context window.\"\"\"\n    text_snippet_chars:\
        \ int = SUMMARY_TEXT_SNIPPET_CHARS\n    tool_result_snippet_chars: int = SUMMARY_TOOL_RESULT_SNIPPET_CHARS\n\
        \    input_max_chars: int = SUMMARY_INPUT_MAX_CHARS\n    input_head_chars:\
        \ int = SUMMARY_INPUT_HEAD_CHARS\n    input_tail_chars: int = SUMMARY_INPUT_TAIL_CHARS\n\
        \    max_tokens: int = 1_536\n    word_limit: int = 700\n\n\n# Required headings\
        \ in a structured compaction handoff (compact.md).\n_REQUIRED_HANDOFF_HEADINGS\
        \ = (\"### Goal\", \"### Next step\")\n\n\ndef validate_compaction_summary(summary:\
        \ str) -> str | None:\n    \"\"\"Return an error reason if *summary* is not\
        \ a usable handoff, else None.\"\"\"\n    text = (summary or \"\").strip()\n\
        \    if not text:\n        return \"compaction summary came back empty\"\n\
        \    # Reject trivially short prose that cannot carry a structured handoff.\n\
        \    if len(text) < 40:\n        return \"compaction summary too short to\
        \ be a handoff\"\n    missing = [h for h in _REQUIRED_HANDOFF_HEADINGS if\
        \ h not in text]\n    if missing:\n        return f\"compaction summary missing\
        \ required headings: {', '.join(missing)}\"\n    return None\n\n\n@dataclass\n\
        class CompactionPlan:\n    \"\"\"Plan for which messages to pin vs summarize.\"\
        \"\"\n    pinned_indices: set[int] = field(default_factory=set)\n    summarize_indices:\
        \ list[int] = field(default_factory=list)\n\n\n@dataclass\nclass CompactionResult:\n\
        \    \"\"\"Result of a compaction operation with metadata.\"\"\"\n    messages:\
        \ list[Message]\n    summary_prompt: str | None = None\n    removed_messages:\
        \ list[Message] = field(default_factory=list)\n    retries_used: int = 0\n\
        \    success: bool = False\n    failure_reason: str | None = None\n\n\ndef\
        \ _summary_input_limits_for_model(model: str, model_config: object | None\
        \ = None) -> SummaryInputLimits:\n    \"\"\"Get summary input limits based\
        \ on model context window.\"\"\"\n    from deepseek_tui.config.providers import\
        \ configured_context_window\n\n    is_large_context = configured_context_window(model,\
        \ model_config) >= LARGE_CONTEXT_WINDOW_TOKENS\n\n    if is_large_context:\n\
        \        return SummaryInputLimits(\n            text_snippet_chars=LARGE_CONTEXT_SUMMARY_TEXT_SNIPPET_CHARS,\n\
        \            tool_result_snippet_chars=LARGE_CONTEXT_SUMMARY_TOOL_RESULT_SNIPPET_CHARS,\n\
        \            input_max_chars=LARGE_CONTEXT_SUMMARY_INPUT_MAX_CHARS,\n    \
        \        input_head_chars=LARGE_CONTEXT_SUMMARY_INPUT_HEAD_CHARS,\n      \
        \      input_tail_chars=LARGE_CONTEXT_SUMMARY_INPUT_TAIL_CHARS,\n        \
        \    max_tokens=LARGE_CONTEXT_SUMMARY_MAX_TOKENS,\n            word_limit=1_200,\n\
        \        )\n    else:\n        return SummaryInputLimits()\n\n\n\ndef _elide_middle(text:\
        \ str, max_chars: int) -> str:\n    \"\"\"Trim *text* to *max_chars* keeping\
        \ both ends, and say that you did.\n\n    The summarizer's per-block limit\
        \ used to be a silent head cut. Two things\n    went wrong with that. A conclusion\
        \ sits at the *end* of a message — \"so\n    I'll use X because Y\", the assertion\
        \ line of a traceback — so head-only\n    keeps the exploration and drops\
        \ the decision. And with no marker the\n    summarizer cannot tell a complete\
        \ short message from a severed long one,\n    so it records half a decision\
        \ as the whole decision. L0 prune already\n    trims tool results head+tail\
        \ for the same reason.\n    \"\"\"\n    if max_chars <= 0:\n        return\
        \ \"\"\n    if len(text) <= max_chars:\n        return text\n    marker_template\
        \ = \"\\n[... {} characters omitted ...]\\n\"\n    # Reserve room for the\
        \ marker so the result honours max_chars.\n    budget = max_chars - len(marker_template.format(len(text)))\n\
        \    if budget < 2:\n        return _truncate_chars(text, max_chars)\n   \
        \ head_chars = (budget * 2) // 3\n    tail_chars = budget - head_chars\n \
        \   omitted = len(text) - head_chars - tail_chars\n    return (\n        text[:head_chars]\n\
        \        + marker_template.format(omitted)\n        + text[len(text) - tail_chars\
        \ :]\n    )\n\n\n_TOOL_ARG_VALUE_CHARS = 160\n_TOOL_ARGS_TOTAL_CHARS = 480\n\
        \n\ndef _render_tool_args(args: dict[str, Any]) -> str:\n    \"\"\"Say which\
        \ action a tool call was, without reproducing its payload.\n\n    ``[Used\
        \ tool: edit_file]`` does not tell the summarizer which file was\n    edited,\
        \ so ``### Done`` cannot name the patches it is asked to name.\n\n    Size\
        \ separates the two kinds of argument on its own, which is why there\n   \
        \ is no per-tool table here: the ones that identify the action — path,\n \
        \   command, pattern, url — are short, and the ones carrying a body —\n  \
        \  content, old_string, prompt — are not. A table would also have to be\n\
        \    kept in step with every new tool and could never cover MCP tools\n  \
        \  registered at runtime. Oversized values collapse to their size, which\n\
        \    still records that a body was there.\n    \"\"\"\n    if not args:\n\
        \        return \"\"\n    parts: list[str] = []\n    used = 0\n    for key,\
        \ value in args.items():\n        rendered = value if isinstance(value, str)\
        \ else repr(value)\n        if len(rendered) > _TOOL_ARG_VALUE_CHARS:\n  \
        \          rendered = f\"<{len(rendered)} chars>\"\n        part = f\"{key}={rendered}\"\
        \n        if used + len(part) > _TOOL_ARGS_TOTAL_CHARS:\n            parts.append(\"\
        ...\")\n            break\n        parts.append(part)\n        used += len(part)\n\
        \    return \", \".join(parts)\n\n\ndef _truncate_chars(text: str, max_chars:\
        \ int) -> str:\n    \"\"\"Keep the first *max_chars* characters, respecting\
        \ Unicode.\"\"\"\n    if max_chars == 0:\n        return \"\"\n    if len(text)\
        \ <= max_chars:\n        return text\n    return text[:max_chars]\n\n\ndef\
        \ _tail_chars(text: str, max_chars: int) -> str:\n    \"\"\"Extract last max_chars\
        \ characters from text.\"\"\"\n    if max_chars <= 0:\n        return \"\"\
        \n    if len(text) <= max_chars:\n        return text\n    return text[-max_chars:]\n\
        \n\ndef _extract_paths_from_text(text: str, workspace: Path | None = None)\
        \ -> list[str]:\n    \"\"\"Extract file paths from text using regex patterns.\"\
        \"\"\n    paths: list[str] = []\n    if not text:\n        return paths\n\n\
        \    # Match common file patterns: .py, .rs, .toml, .json, .md, etc.\n   \
        \ pattern = (\n        r\"(?:^|\\s|[\\[\\(\\'\\\"])([./\\-\\w]+\\.(?:py|rs|toml|json|yaml|md|txt|\"\
        \n        r\"sh|sql|js|ts|tsx|jsx))\"\n    )\n    for match in re.finditer(pattern,\
        \ text, re.MULTILINE):\n        candidate = match.group(1).strip(\"'\\\"\"\
        )\n        normalized = _normalize_path_candidate(candidate, workspace)\n\
        \        if normalized and normalized not in paths:\n            paths.append(normalized)\n\
        \n    return paths\n\n\ndef _normalize_path_candidate(path: str, workspace:\
        \ Path | None = None) -> str | None:\n    \"\"\"Normalize a path candidate,\
        \ returning None if invalid.\"\"\"\n    if not path or len(path) < 2 or len(path)\
        \ > 500:\n        return None\n\n    try:\n        # Try to parse as Path\n\
        \        p = Path(path)\n        return str(p)\n    except (ValueError, OSError):\n\
        \        return None\n\n\ndef _estimate_tokens_for_message(msg: Message, include_thinking:\
        \ bool = True) -> int:\n    \"\"\"Estimate token count for a message (conservative).\"\
        \"\"\n    from deepseek_tui.engine.context import estimate_tokens\n\n    parts:\
        \ list[str] = []\n    for block in msg.content:\n        # Handle block as\
        \ object (ContentBlock union types)\n        if hasattr(block, \"text\"):\n\
        \            parts.append(str(getattr(block, \"text\", \"\")))\n        if\
        \ hasattr(block, \"input\"):\n            parts.append(str(getattr(block,\
        \ \"input\", \"\")))\n        if hasattr(block, \"content\"):\n          \
        \  parts.append(str(getattr(block, \"content\", \"\")))\n        if hasattr(block,\
        \ \"thinking\") and include_thinking:\n            parts.append(str(getattr(block,\
        \ \"thinking\", \"\")))\n\n    from deepseek_tui.media import image_token_estimate,\
        \ message_images\n\n    return max(1, estimate_tokens(\"\".join(parts))) +\
        \ sum(\n        image_token_estimate(img) for img in message_images(msg)\n\
        \    )\n\n\ndef plan_compaction(\n    messages: list[Message],\n    pinned_indices:\
        \ set[int] | None = None,\n    *,\n    keep_recent_tokens: int = KEEP_RECENT_TOKENS,\n\
        ) -> CompactionPlan:\n    \"\"\"Generate a compaction plan for messages.\n\
        \n    Pins a recent verbatim window sized by *keep_recent_tokens* (with a\n\
        \    floor of :data:`KEEP_RECENT_MESSAGES`), walking back so the window\n\
        \    never starts on a tool-result message.\n    \"\"\"\n    if not messages:\n\
        \        return CompactionPlan()\n\n    plan = CompactionPlan()\n    pinned_indices\
        \ = pinned_indices or set()\n    from deepseek_tui.protocol.messages import\
        \ Role\n\n    # Grow the keep window from the end until token budget is met\
        \ (or we\n    # hit the message floor, whichever needs more history).\n  \
        \  start = len(messages)\n    accumulated = 0\n    min_messages = KEEP_RECENT_MESSAGES\n\
        \    while start > 0:\n        need_more_msgs = (len(messages) - start) <\
        \ min_messages\n        need_more_tokens = accumulated < keep_recent_tokens\n\
        \        if not need_more_msgs and not need_more_tokens:\n            break\n\
        \        start -= 1\n        accumulated += _estimate_tokens_for_message(\n\
        \            messages[start], include_thinking=False\n        )\n\n    while\
