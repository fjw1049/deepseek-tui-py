        \ None:\n        from deepseek_tui.engine.context_pressure import measure_context_pressure\n\
        \n        pressure = measure_context_pressure(\n            model,\n     \
        \       messages,\n            real_input_tokens=real_input_tokens,\n    \
        \        real_input_estimate=real_input_estimate,\n            system_prompt=system_prompt,\n\
        \            tools=tools,\n            model_config=model_config,\n      \
        \  )\n    return pressure.ratio >= cfg.l0_prune_ratio\n"
      prompts/compact.md: '## Compaction Handoff


        You are about to run out of context. Write a handoff note to yourself so you
        can continue this task seamlessly after the older messages are archived.


        Write it as your own continuing train of thought — first person, present tense,
        the way you would reason through the next move. Not a third-party report about
        someone else''s work. Write it in the language the session has been using;
        do not switch to English because these instructions are in English.


        The next turn will see: this note inside `<archived_context>`, the user''s
        requests quoted verbatim in `<prior_user_requests>`, and a few recent verbatim
        messages. It will **not** see the archived tool outputs — so anything you
        do not carry here is gone unless it can be re-derived from disk.


        Two headings are required, because the runtime checks for them: `### Goal`
        and `### Next step`. The others below are the shape that usually fits a coding
        session — use the ones that carry something and drop the ones that do not.
        Do not keep a heading just to write `None` under it, and add a heading of
        your own where the work calls for one. Let the shape follow the task: a long
        multi-step session warrants detail, a nearly finished one needs a few lines.


        Output **only** Markdown. Do not call tools, do not wrap the output in XML,
        do not add a preamble or closing remarks. Preserve exact file paths, commands,
        errors, and decisions; abbreviate repetitive tool dumps. Be honest about uncertainty
        — this note is worth less than nothing if it reads more confident than the
        work was.


        Two rules about who said what:


        - The transcript labels each line `User:`, `Assistant:` or `Harness:`. Only
        `User:` lines are the human. `Harness:` lines are automated injections from
        the runtime, and `Assistant:` lines may *quote or paraphrase* the user — neither
        is evidence the user said anything. Never turn them into a user request or
        a user constraint. If you are unsure who wanted something, describe it as
        a decision, not as a user instruction.

        - The user''s own requests are carried verbatim in a separate block and do
        not depend on you. Do not spend this note re-paraphrasing them. Spend it on
        what cannot be recovered any other way: what was tried, what it produced,
        what was decided, and why.


        If the session is executing an approved plan, the plan file is the source
        of truth — do not restate its full body. In **Key Decisions** keep settled
        choices that are not already obvious from that file. In **In Progress** /
        **Next step** write the forward plan: what remains, in order, and the next
        concrete action. Preserve the plan file path if the transcript named one,
