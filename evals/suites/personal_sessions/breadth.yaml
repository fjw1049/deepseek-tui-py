- &base
  id: personal.intent_audit
  source_group: codex-91ab6cba
  task_family: data-analysis
  split: development
  suite: personal_sessions
  runner: product_session
  grader: rubric
  live: true
  tags: [development, codex, personal-session, data-audit]
  title: 依据标注表审核预期产品与意图
  description: Codex 91ab6cba，JSONL 10、32、39；用合成 CSV 代替 Excel 导出，仅取测试前审核阶段。
  setup:
    files:
      labels.csv: |
        id,product,intent
        Q8,乙,报价
        Q3,甲,咨询
        Q4,丙,
      results.csv: |
        id,product,intent
        Q4,丙,退订
        Q8,甲,报价
        Q3,甲,咨询
  input:
    turns: ['预期产品、意图以 labels.csv 为准。审核 results.csv，按 ID 告诉我哪些错、哪些暂时评不了，以及为什么。先给我审核结论。']
  expect:
    checks:
    - {type: unchanged, name: 标注与预测原样保留, paths: [labels.csv, results.csv]}
    - {type: answer_contains, name: 逐项可定位, all_of: [Q8, Q3, Q4]}
    rubric: [Q8 产品应为乙而预测甲、意图正确；Q3 两项正确；Q4 产品正确且无预期意图，不能把预测当标注。不按行号拼表。]
- <<: *base
  id: personal.desktop_plan
  source_group: claude-45131d98
  task_family: planning
  split: development
  tags: [development, claude, personal-session, tool-selection]
  title: 自研原生 GUI 与浏览器怎样协作测试
  description: Claude 45131d98，JSONL 7、102；重建工具能力清单及测试流程。
  setup:
    files:
      capabilities.txt: |
        browser 能读网页 DOM、按元素操作网页，读不到原生窗口。
        desktop 能观察原生窗口和操作系统对话框。用户接管后旧元素引用失效。
        测试流程：从原生编辑器选择导出文件，打开网页预览并核对本次导出的标题。
  input:
    turns:
    - 看 capabilities.txt，举例说明这两个工具怎么协作。
    - 那我自己的 GUI 能测吗？按文件里这个流程给我可执行的测试步骤。如果中间我接管了怎么接着测？这次只写方案。
  expect:
    checks: [{type: unchanged, name: 保留能力说明, paths: [capabilities.txt]}]
    rubric: [说清原生窗口及系统选择器用 desktop，网页用 browser；把同一次导出的文件或标题贯穿核验，接管回来重新观察；没有虚报已实测。]
- <<: *base
  id: personal.call_without_variables
  source_group: codex-6d5c0a44
  task_family: explanation
  split: development
  title: 没有下发变量仍调用远端的原因
  tags: [development, codex, personal-session, debugging]
  description: Codex 6d5c0a44，JSONL 11；把真实调用链改为无网络的最小实现。
  setup:
    files:
      flow.py: |
        def step(pending, fetch, send):
            snapshot = fetch()
            if pending:
                send(pending, snapshot)
      trace.txt: |
        step pending=[]
        fetch 200
        step pending=[city]
        fetch 200
        send city
  input:
    turns: [为什么我没下发变量还一直在调远程接口？对照代码和记录定位一下，告诉我这两次分别干了什么，先审核。]
  expect:
    checks: [{type: unchanged, name: 仅审核保留原始实现与记录, paths: [flow.py, trace.txt]}]
    rubric: [指出 fetch 在判断前无条件执行，两次均调用 fetch、只有第二次 send；不能凭两条记录断言有重试或定时循环。]
