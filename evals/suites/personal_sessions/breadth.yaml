- <<: *base
  id: personal.model_alias
  source_group: claude-804573d3
  task_family: explanation
  split: development
  title: 两个模型名是否都能用于当前服务
  tags: [development, claude, personal-session, deployment]
  description: Claude 804573d3，JSONL 27；替换模型名和部署资料，验证能否区分权重路径与 API 名称。
  setup:
    files:
      launch.txt: |
        serve /weights/orchid-27b --served-model-name sales-blue
      api_snapshot.json: |
        {"data":[{"id":"sales-blue"}]}
      smoke.log: |
        POST model=sales-blue status=200
        POST model=orchid-27b status=404 error=model_not_found
  input:
    turns: ['orchid-27b、sales-blue 这两个都能作为这个接口的 model 参数吗？以目录里这次部署和试调结果为准。']
  expect:
    checks: [{type: unchanged, name: 不改服务快照, paths: [launch.txt, api_snapshot.json, smoke.log]}]
    rubric: [仅 sales-blue 被列出且请求成功；orchid-27b 是磁盘名称，此次以它调用返回 404。不能泛化为该权重不支持推理。]
- <<: *base
  id: personal.eval_portfolio
  source_group: codex-48d6b4c0
  task_family: data-analysis
  split: development
  title: 从重复的简单题重组成有跨度的评测数据
  tags: [development, codex, personal-session, eval-design]
  description: Codex 48d6b4c0，JSONL 17；以脱敏候选任务池代替外部下载，限定为整理阶段。
  setup:
    files:
      pool.txt: |
        A1 查询给定工单的负责人。A2 问工单负责人叫什么。A3 告诉我谁负责该工单。
        B1 两份费用表行序不同，其中一笔退款晚到，需要按单号重算。
        C1 用户先要求发布公告，随后纠正只保存草稿。
        D1 提交已成功但返回超时，能查回执，再次提交会产生重复记录。
  input:
    turns: ['之前测的题太相似。请从 pool.txt 选代表，再造至少一个不同机制的复杂需求，整理成 cases.json，先别跑模型。每项给 source（候选编号或 new）、request 和 oracle，别人要能照着判断对错。别只改个说法。']
  expect:
    checks:
    - {type: unchanged, name: 候选池未改, paths: [pool.txt]}
    - name: 去重并引入新机制的可读用例集
      type: command
      argv:
      - python3
      - -c
      - |
        import json
        rows=json.load(open('cases.json'))
        assert isinstance(rows,list)
        sources=[r['source'] for r in rows]
        assert sum(k in ['A1','A2','A3'] for k in sources)<=1
        assert 'new' in sources and any(k in ('A1','A2','A3','B1','C1','D1') for k in sources)
        assert all(isinstance(r['request'],str) and r['request'].strip() for r in rows)
        assert all(isinstance(r['oracle'],(str,dict,list)) and bool(r['oracle']) for r in rows)
    rubric: [每项能执行并能从明确事实判断结果；费用需能按键核算或有明示夹具，授权纠正核对草稿及未发布，超时恢复核对提交次数及结果（按所选题判）；新增任务的失败机制与所选题有实质差异。]
