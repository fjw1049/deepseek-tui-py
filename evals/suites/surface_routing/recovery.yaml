# Decision probes use synthetic observations; tools are not executed.
# Pair blockers with non-blockers to catch overcorrection toward unnecessary help.
- schema_version: 1
  id: surface.recovery_desktop_expired_session
  suite: surface_routing
  risk: high
  runner: live_decision
  grader: tooling
  live: true
  tags: [recovery, desktop, login, live]
  related_paths: [src/deepseek_tui/prompts/computer_use.md]
  input:
    surfaces: [desktop]
    messages:
      - role: user
        content: 在桌面的项目管理应用里查看我本周待办并汇总。
      - role: assistant
        tool_calls:
          - id: desktop-1
            name: cua_js
            arguments: {code: 'var app = await cua.getApp("com.example.projects");', title: 查看项目应用}
      - role: tool
        tool_use_id: desktop-1
        content: 'Current window: 登录。会话已过期，请重新登录后查看项目。No projects are visible. Login form: phone number, verification code. No security alert or account restriction.'
  expect:
    expected_any_tool: [request_user_input]
    expected_argument_text: ['desktop']
    forbidden_tools: [cua_js, exec_shell, web_search]

- schema_version: 1
  id: surface.recovery_required_browser_login
  suite: surface_routing
  risk: high
  runner: live_decision
  grader: tooling
  live: true
  tags: [recovery, browser, login, live]
  related_paths: [src/deepseek_tui/prompts/browser.md]
  input:
    surfaces: [browser]
    messages:
      - role: user
        content: 用浏览器查看微博里我关注的人对 iG 对 GEN 半决赛的评论，给我概括一下。
      - role: assistant
        tool_calls:
          - id: browser-1
            name: browser_use
            arguments: {action: observe}
      - role: tool
        tool_use_id: browser-1
        content: 'Current page: passport.weibo.com, 登录微博。关注动态仅登录后可见。The page contains only a QR login panel and phone/password login tabs; no comments are visible.'
  expect:
    expected_any_tool: [request_user_input]
    expected_argument_text: ['browser']
    forbidden_tools: [web_search, fetch_url, exec_shell]

- schema_version: 1
  id: surface.recovery_incidental_login
  suite: surface_routing
  risk: medium
  runner: live_decision
  grader: tooling
  live: true
  tags: [recovery, browser, login, live]
  related_paths: [src/deepseek_tui/prompts/browser.md]
  input:
