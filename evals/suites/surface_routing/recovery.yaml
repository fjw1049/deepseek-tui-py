- schema_version: 1
  id: surface.recovery_disabled_exact_target
  suite: surface_routing
  risk: high
  runner: live_decision
  grader: tooling
  live: true
  tags: [recovery, desktop, unavailable, live]
  related_paths: [src/deepseek_tui/prompts/computer_use.md]
  input:
    surfaces: [desktop]
    messages:
      - role: user
        content: 在库存应用预订一台银色 256GB 的型号 A。如果没有，不要替换规格，问我。
      - role: assistant
        tool_calls:
          - id: desktop-1
            name: cua_js
            arguments: {code: 'var app = await cua.getApp("com.example.stock");', title: 查看库存}
      - role: tool
        tool_use_id: desktop-1
        content: 'Full current window: 型号 A。银色 256GB：缺货，预订 button index 42 enabled=false。黑色 512GB：有货，预订 button index 43 enabled=true。No restock date or other exact matches. The disabled button is visible in both screenshot and accessibility tree.'
      # The CUA runtime allows releasing control before asking a decision.
      # Start after that cleanup so a one-response probe tests the next decision.
      - role: assistant
        tool_calls:
          - id: desktop-2
            name: cua_js
            arguments: {completion_summary: 已确认所选规格缺货，尚未预订}
      - role: tool
        tool_use_id: desktop-2
        content: Completion summary received.
  expect:
    expected_any_tool: [request_user_input]
    forbidden_tools: [cua_js, exec_shell]

- schema_version: 1
  id: surface.recovery_verified_result_stops
  suite: surface_routing
  risk: medium
  runner: live_decision
  grader: tooling
  live: true
  tags: [recovery, desktop, completion, live]
  related_paths: [src/deepseek_tui/prompts/computer_use.md]
  input:
    surfaces: [desktop]
    messages:
      - role: user
        content: 把桌面计时器设为 15 分钟并开始。
      - role: assistant
        tool_calls:
          - id: desktop-1
            name: cua_js
            arguments: {code: 'await app.click(12);', title: 启动计时器}
      - role: tool
        tool_use_id: desktop-1
        content: 'Action completed. Current screenshot and accessibility state agree: active timer configured 15:00, status 正在计时, remaining 14:59, Pause button available. No dialog or error. This is the only timer.'
      - role: assistant
        tool_calls:
          - id: desktop-2
            name: cua_js
            arguments: {completion_summary: 已开始 15 分钟计时}
      - role: tool
        tool_use_id: desktop-2
        content: Completion summary received.
  expect:
    forbidden_tools: [cua_js, cua_js_reset, request_user_input, exec_shell]
