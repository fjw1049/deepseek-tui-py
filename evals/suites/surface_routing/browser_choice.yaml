# Decision probes only; run explicitly with a bounded company-model budget.
# These cases were written for the browser routing fix, so they are tuned.
- schema_version: 1
  id: surface.live_generic_browser_with_chrome_enabled
  suite: surface_routing
  risk: medium
  runner: live_decision
  grader: tooling
  live: true
  tags: [surface-routing, browser, tuned, live]
  related_paths: [src/deepseek_tui/prompts/browser.md]
  input:
    surfaces: [browser, chrome, desktop]
    messages:
      - role: user
        content: 打开浏览器看看今天美国的热搜。
  expect:
    expected_any_tool: [browser_use]
    forbidden_tools: [cua_js, cua_act, cua_observe, cua_js_reset]

