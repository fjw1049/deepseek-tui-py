# Surface routing probes: one real model response per case with the given
# surfaces offered; tools are observed, never executed, so no desktop is touched.
# The harness uses the installed runtime's own tool catalog when available.
# Tags: "tuned" cases were seen while revising the prompts; "held-out" cases were
# written afterwards and never used for tuning, to check generalization.
- schema_version: 1
  id: surface.live_unscriptable_app_uses_computer_use
  suite: surface_routing
  risk: high
  runner: live_decision
  grader: tooling
  live: true
  tags: [surface-routing, desktop, tuned, live]
  related_paths: [src/deepseek_tui/prompts/computer_use.md]
  input:
    surfaces: [desktop]
    messages:
      - role: user
        content: 看一下我电脑上「微信」窗口里现在打开的是哪个聊天。
  expect:
    expected_any_tool: [cua_js]
    # The first call must be a documented entry point, as the runtime requires.
    expected_argument_text: [cua.getApp, cua.getState]
    forbidden_tools: [write_file, edit_file]

