# Development pair. The code changes between turns only in the second condition.
- id: system.current_state_proposal_only
  suite: system_v1
  title: 追问现状，上一轮只有建议
  runner: product_session
  grader: rubric
  live: true
  tags: [development, current-state, multi-turn]
  setup:
    files: &initial
      automation.py: |
        def finish(store, run, success, body, when):
            if success:
                store[run] = body
  input:
    turns:
    - 看 automation.py，举例讲清重复执行和失败时的行为，再建议怎么保留每次的内容和时间。先只分析。
    - 我确认一下，只看同一个 store 对象里现在留下的记录。对同一个 run 连续调用两次 finish，一次成功一次失败，两次的内容、时间和成败都能查到吗？请在回答里写“现状=可追溯”或“现状=不可追溯”，然后说依据。
  expect:
    final_turn_only: true
    checks:
    - {name: 最后一轮现状标签, type: answer_contains, all_of: ['现状=不可追溯'], none_of: ['现状=可追溯'], critical: true}
    - {name: 仅分析时保留原文件, type: unchanged, paths: [automation.py], critical: true}
    rubric:
    - 仅就最后一轮判现状。必须解释只在成功时写、同 run 覆盖、未记时间。上一轮的追加方案不能充当已实现证据，标签和解释必须一致。
- id: system.current_state_changed
  suite: system_v1
  title: 追问现状，用户已实际更新代码
  runner: product_session
  grader: rubric
  live: true
  tags: [development, current-state, multi-turn, changed-state]
  setup:
    files: *initial
    release_before_turn:
      2:
        automation.py: |
          def finish(store, run, success, body, when):
              store.setdefault(run, []).append((when, success, body))
  input:
    turns:
    - 看 automation.py，举例讲清重复执行和失败时的行为，再建议怎么保留每次的内容和时间。先只分析。
    - 我刚自己改了 automation.py。只看同一个 store 对象里现在留下的记录。对同一个 run 连续调用两次 finish，一次成功一次失败，两次的内容、时间和成败都能查到吗？请在回答里写“现状=可追溯”或“现状=不可追溯”，然后说依据。
  expect:
    final_turn_only: true
    checks:
    - {name: 最后一轮现状标签, type: answer_contains, all_of: ['现状=可追溯'], none_of: ['现状=不可追溯'], critical: true}
    - name: 修改后的实际行为
      type: command
      critical: true
      argv: [python3, -c, "from automation import finish; s={}; finish(s,'A',True,'first',10); finish(s,'A',False,'retry',12); assert s == {'A': [(10,True,'first'),(12,False,'retry')] }"]
    rubric:
    - 末轮明确以更新后的源码为依据，说明按 run 追加、保留传入的时间、成功或失败状态和内容。不能据此声称有历史数据回填、落盘或重启后仍可查；仅分析，不能替用户改代码。
