- id: claude.label_score
  title: 修订分类计分，保持其他类别精确匹配
  description: 8462b52b，抽取分类用户关于定向等价的口径，重建标签和验收数据。
  suite: claude_sessions
  runner: product_session
  grader: rubric
  live: true
  setup:
    files:
      score.py: |
        def matches(gold, prediction):
            return gold == prediction
  input:
    turns:
    - 帮我改 score.py。标准标签 F,OTHER 遇到预测具体 F 子标签（F,NEED、F,TRUST、F,BUSY、F,PRICE）都算对。别把其他错分也算进去。
  expect:
    checks:
    - name: 四个放宽项、精确匹配、反向与邻近错例
      type: command
      critical: true
      argv:
      - python3
      - -c
      - |
        from score import matches
        for label in ['F,NEED','F,TRUST','F,BUSY','F,PRICE']:
            assert matches('F,OTHER', label) and matches(label,label)
            assert not matches(label,'F,OTHER')
            assert not matches('F',label) and not matches('OTHER',label)
        assert matches('F,OTHER','F,OTHER') and matches('E,TAG7','E,TAG7')
        for pred in ['F,FAKE','F,PRICEY','E,TAG7','E7','']:
            assert not matches('F,OTHER',pred)
        assert not matches('F,NEED','F,BUSY')
    rubric: [实际修改可调用的 matches，单向放宽恰好四个标签，其他标签继续按原规则比较。]

