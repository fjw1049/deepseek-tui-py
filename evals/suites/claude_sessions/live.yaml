- id: claude.architecture_html
  title: 由路由入口追到写入线程并实际交付 HTML
  description: 09af93f5，抽取 Octop 从路由逐层审核并画 HTML 架构图的需求，模块结构重建。
  suite: claude_sessions
  runner: product_session
  grader: rubric
  live: true
  setup:
    files:
      routes.py: |
        from bridge import receive
        def dispatch(path, event):
            if path == '/inbox':
                return receive(event)
            return 404
      bridge.py: |
        from store import append
        def receive(event):
            if not event.get('thread_id'):
                return 422
            append(event['thread_id'], event['result'])
            return 202
      store.py: |
        threads = {}
        def append(thread_id, result):
            threads.setdefault(thread_id, []).append(result)
  input:
    turns: [从路由入口审核这个项目，给我一份能直接打开的 architecture.html 架构图。讲清消息怎么回到原会话，出错走哪里。]
  expect:
    checks:
    - {name: HTML 包含路由和不同失败码, type: file_contains, glob: architecture.html, all_of: [/inbox, '422', '404'], critical: true}
    - {name: 三个源码文件未变, type: unchanged, paths: [routes.py, bridge.py, store.py], critical: true}
    rubric: [HTML 内有可读图示，主路径从 dispatch 到 receive 到 append，thread_id 决定写回的原会话，给出正常 202 与两种错误分支；避免编造实际外部投递。]

- id: claude.takeover_history
  title: 多轮解释接管后保留什么、丢弃什么
  description: b6ee72ce，以代码重建人工接管时历史与当前观察分离的语义。
  suite: claude_sessions
  runner: product_session
  grader: rubric
  live: true
  setup:
    files:
      handoff.py: |
        def take_over(state):
            state['owner'] = 'user'
            state['element_refs'].clear()
            state['history'].append('handoff')
        def resume(state, fresh_view):
            state['owner'] = 'agent'
            state['element_refs'] = fresh_view
            state['history'].append('resumed')
  input:
    turns: [看看 handoff.py，人工接管和还回去是什么逻辑？, 就是那轮的旧观察全清了，历史也没了，是这个意思吗？]
  expect:
    final_turn_only: true
    checks:
    - {name: 接管逻辑保持原样, type: unchanged, paths: [handoff.py], critical: true}
    rubric: [最终答复纠正误解，元素引用清空、还回时用 fresh_view，history 保留并追加事件，区分用户接管和恢复动作。]

- id: claude.automation_runs
  title: 自动化历史遇到重跑和失败
