        a=s.load_settings('settings.json');a['theme']='dark';a['views'][0]['columns'].append('x')
        b=s.load_settings('settings.json');assert b['theme']=='light' and b['views'][0]['columns']==['name','date'];print('OK')
      critical: true
      stdout_contains:
      - OK
    - name: 原调用方式保留
      type: command
      argv:
      - python3
      - -c
      - import settings;print(settings.load_settings('settings.json')['theme'])
      critical: true
