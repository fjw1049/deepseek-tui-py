- schema_version: 1
  id: daily.review_queue
  title: 审查任务队列
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - code_review
  - 偏难
  - review
  setup:
    files:
      queue_store.py: |
        import json
        from pathlib import Path
        class Queue:
            def __init__(self, path): self.path = Path(path)
            def add(self, value):
                tasks = json.loads(self.path.read_text()) if self.path.exists() else []
                tasks.append(value)
                self.path.write_text(json.dumps(tasks))
            def run(self, process):
                tasks = json.loads(self.path.read_text())
                self.path.write_text('[]')
                for task in tasks: process(task)
  input:
    turns:
    - 我们的批处理偶尔中途失败，负责人想知道这版任务队列能不能放心交给其他同事用。 目录里是同事准备交接的实现，请按准备实际使用的标准审查，把有依据的问题和影响写清楚。项目希望直接在本地运行。
    - 把会造成数据丢失的问题改好，并用几个本地样例说明中途退出以后能恢复到什么程度。不要承诺本地文件本身保证不了的东西。
  expect:
    checks: []
    rubric:
    - 指出 run 先清空再处理：中途失败或进程退出时剩余任务永久丢失。这是阻塞问题。
    - 指出 add 的读改写不是原子的：多进程会丢任务，写入中断可能损坏 JSON。
    - 给出影响和依据，而不是泛泛建议。
    - 第二轮修好丢数据的问题，用本地样例说明中途退出能恢复到什么程度，不承诺本地文件保证不了的东西。
- schema_version: 1
  id: daily.review_pagination
  title: 审查分页接口
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - code_review
  - 偏难
  - review
  setup:
    files:
      customers.py: |
        ROWS = [{'id': i, 'joined': i // 3} for i in range(1, 18)]
        def page(rows, cursor=None, limit=5):
            ordered = sorted(rows, key=lambda row: row['joined'])
            start = int(cursor or 0)
            chosen = ordered[start:start+limit]
            following = str(start+limit) if len(chosen) == limit else None
            return {'rows': chosen, 'next': following}
  input:
    turns:
    - 我们的小型客户列表准备交付，客户会连续翻页，也会重复打开同一页。看看这版分页接口有没有值得挡住发布的问题。 目录里是同事准备交接的实现，请按准备实际使用的标准审查，把有依据的问题和影响写清楚。项目希望直接在本地运行。
    - 上线前又加了一个要求：有人翻到第二页时，前面可能刚新增一条记录。请处理你认为必须处理的地方，说明对外保证的翻页规则。
  expect:
    checks:
    - name: 有新增记录时翻页不重不漏
      type: command
      argv:
      - python3
      - -c
      - |-
        import customers as c
        rows=list(c.ROWS)
        a=c.page(rows,limit=5)
        rows.insert(0,{'id':99,'joined':-1})
        b=c.page(rows,cursor=a['next'],limit=5)
        ids=[r['id'] for r in a['rows']+b['rows']]
        assert len(ids)==len(set(ids)),ids;print('OK')
      critical: false
      stdout_contains:
      - OK
    rubric:
    - 指出排序键 joined 有重复，缺少稳定的次序，需要用 id 作为第二键。
    - 指出偏移量游标在翻页中途新增记录时会重复或漏项。
    - 指出恰好整除时 next 不为空，多返回一个空页的问题，或 limit/cursor 校验问题。
    - 第二轮改成基于键的游标，并写明对外保证的翻页规则。
