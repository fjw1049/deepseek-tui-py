# 真实产品入口的任务场景。题面来自 2026-10-29 soak 题库，资料按用例分发、随机量已固定。
# checks 是可复核的事实，rubric 是交给独立评审的验收要点。
- schema_version: 1
  id: daily.orders
  title: 对账：订单与收款
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - general
  - 偏难
  - data
  setup:
    files:
      orders.csv: |
        order_id,amount,status
        A01,120,active
        A02,260,active
        A03,80,cancelled
        A04,200,active
        A05,,active
        A06,320,active
      payments.csv: |
        payment_id,order_id,amount
        P01,A01,120
        P02,A02,200
        P02,A02,200
        P03,A03,80
        P04,A04,210
        P05,A06,320
        P06,A99,100
    release_before_turn:
      2:
        refunds.csv: |
          refund_id,order_id,amount
          R01,A03,80
          R02,A04,10
  input:
    turns:
    - 财务说这个月收到的钱和订单对不上，附件是导出的两张表。帮我看看怎么回事，整理一份我们可以拿去处理的清单。
    - 退款数据补上了，在 refunds.csv。你再看看现在还剩哪些事要处理。
  expect:
    checks:
    - name: 输入资料未被改动
      type: unchanged
      paths:
      - orders.csv
      - payments.csv
    - name: 有可处理的清单文件
      type: file_exists
      glob: '*.*'
      critical: true
      min_count: 4
    rubric:
    - A02 应收 260，P02 重复记录一次，去重后实收 200、差 60，清单要同时指出重复和差额。
    - A03 是已取消订单却收款 80；第二轮 R01 退款 80 后已平。
    - A04 多收 10；第二轮 R02 退款 10 后已平。
    - A05 金额缺失，不能当作 0 也不能当作已平，要列为待确认。
    - P06 收款 100 对应不存在的订单 A99，要列为待查。
    - 第二轮明确说明现在还剩哪些事：A02 的差额与重复、A05、P06/A99；不再把 A03、A04 列为待处理。
- schema_version: 1
  id: daily.reimbursement
  title: 差旅报销整理与口径更新
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - general
  - 中等
  - data
  setup:
    files:
      expenses.csv: |
        person,date,category,amount,receipt_id,note
        李明,2026-09-30,住宿,520.00,F001,一晚
        李明,2026-10-01,交通,126.50,F002,高铁
        张悦,2026-10-01,餐饮,88.30,F003,午餐
        李明,2026-09-30,住宿,520.00,F001,一晚
        张悦,2026-10-02,交通,-20.00,F004,退票
        赵青,2026-10-02,物料,,F005,金额缺失
        王宁,2026-10-02,住宿,430.00,F006,一晚
  input:
    turns:
    - 这些是这次出差的报销材料，帮我整理好，我下午要交给财务。需要一份表格和一段能直接贴到邮件里的说明。
    - 财务刚说住宿按每人每晚450元报，帮我按这个口径更新一下。
  expect:
    checks:
    - name: 输入资料未被改动
      type: unchanged
      paths:
      - expenses.csv
    rubric:
    - F001 李明住宿 520 是重复行，只计一次。
    - F005 赵青物料金额缺失，不能按 0 计入后不提，要列为待补。
    - F004 张悦退票 -20 作为冲减处理，并让用户知道。
    - 第二轮按每人每晚 450 重算：李明住宿 520 改按 450，王宁 430 不变。
    - 扣除重复、未计入 F005、按 450 口径后合计为 1074.80 元；如果口径不同，要说明差异来源。
    - 有一段能直接贴进邮件的说明，且金额与表格一致。
- schema_version: 1
  id: daily.expense_tool
  title: 修复汇总脚本
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - coding
  - 偏难
  - coding
  setup:
    files:
      expense_summary.py: |
        import csv,sys,json
        def summarize(path):
         out={}
         for row in csv.DictReader(open(path)):
          month=row['date'][5:7]
          out[month]=out.get(month,0)+abs(float(row['amount']))
         return out
        if __name__=='__main__': print(json.dumps(summarize(sys.argv[1]),ensure_ascii=False))
      expenses.csv: |
        person,date,category,amount,receipt_id,note
        李明,2026-09-30,住宿,520.00,F001,一晚
        李明,2026-10-01,交通,126.50,F002,高铁
        张悦,2026-10-01,餐饮,88.30,F003,午餐
        李明,2026-09-30,住宿,520.00,F001,一晚
        张悦,2026-10-02,交通,-20.00,F004,退票
        赵青,2026-10-02,物料,,F005,金额缺失
        王宁,2026-10-02,住宿,430.00,F006,一晚
  input:
    turns:
    - 财务最近不愿意用这个汇总脚本了，说算出来和他们手工核的对不上。代码和一份材料都在目录里，帮我弄到可以放心继续用。
    - 他们平常从Excel另存CSV，有时金额前面还带人民币符号，这种也得能用。
  expect:
    checks:
    - name: 脚本能处理缺失金额、退票和重复单据
      type: command
      critical: true
      # A script that flags bad rows may fairly exit non-zero; its totals are what matter.
      expect_exit: [0, 1, 2, 3]
      stdout_contains:
      - '624.8'
      argv:
      - python3
      - expense_summary.py
      - expenses.csv
    - name: 第二轮：能读带人民币符号的金额
      type: command
      argv:
      - python3
      - -c
      - |-
        from pathlib import Path;import expense_summary as e
        Path('probe.csv').write_text('person,date,category,amount,receipt_id,note\n甲,2026-11-01,交通,￥120.50,X1,\n乙,2026-11-02,交通,¥1,000.00,X2,\n'.replace('¥1,000.00','"¥1,000.00"'),encoding='utf-8')
        r=e.summarize('probe.csv');print(r)
      critical: true
      stdout_contains:
      - '1120.5'
    rubric:
    - 找到并修复 abs() 把退票 -20 算成支出的问题，退票应冲减。
    - 重复单据 F001 不重复计入，或明确给出处理方式。
    - 金额缺失的行不会让脚本崩溃，也不被静默当作 0，要让用户知道被跳过了什么。
    - 说明修改前后结果差异，让财务能核对。
    - 第二轮处理了人民币符号，还考虑了千分位或表格另存常见格式。
- schema_version: 1
  id: daily.logs
  title: 跨日志定位下单故障
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - general
  - 偏难
  - analysis
  setup:
    files:
      logs/app.log: |
        2026-10-28T15:59:59Z INFO request=r01 checkout accepted
        2026-10-28T16:00:01Z ERROR request=r01 inventory timeout retry=1
        2026-10-29T00:00:02+08:00 INFO request=r02 checkout accepted
        2026-10-28T16:00:03Z INFO request=r01 retry succeeded status=200
        2026-10-29T00:00:04+08:00 ERROR request=r02 db unique violation payment_id=P72
        2026-10-29T00:00:04+08:00 WARN request=r02 response status=409
      logs/gateway.log: |
        2026-10-28T16:00:00Z INFO request=r01 duration=4200ms status=200
        2026-10-28T16:00:02Z WARN request=r02 client_retry original=r00 payment_id=P72
        2026-10-28T15:59:58Z INFO request=r00 duration=300ms status=200 payment_id=P72
  input:
    turns:
    - 昨晚有客户说下单报错，客服后来又说有些单其实成功了。日志在目录里，帮我看看大概发生了什么，我得和研发沟通。
    - 客户把手机上显示的时间发来了，是北京时间凌晨零点附近。把你给研发的说明整理成一页，方便他们接手。
  expect:
    checks:
    - name: 输入资料未被改动
      type: unchanged
      paths:
      - logs/app.log
      - logs/gateway.log
    - name: 有给研发的说明文件
      type: file_exists
      # Any deliverable format; the leading class skips the seeded AGENTS.md.
      glob: '[!A]*.*'
      critical: false
    rubric:
    - 把 +08:00 和 Z 时间统一换算到同一时区后再排时间线。
    - r01：库存超时后重试成功，最终 200，耗时约 4.2 秒，用户感受是慢或报错但实际成功。
    - r02：是网关 client_retry 对原请求 r00 的重试，r00 已用 payment_id=P72 成功，r02 因唯一约束冲突返回 409。这就是“报错但其实成功”的原因。
    - 不把这说成重复扣款已发生；日志没有证明的事要标为推测。
    - 第二轮把客户手机时间（北京时间零点附近）对应到 UTC 16:00 附近的日志，并整理成一页交接。
- schema_version: 1
  id: daily.documents
  title: 项目建议书 Word 与 PDF
  suite: daily_tasks
  risk: medium
  runner: product_session
  grader: rubric
  live: true
  tags:
  - general
  - 中等
  - office
  setup:
    files:
      brief.txt: |
        社区服务团队项目建议书
        客户：晨光服务中心
        目标：减少人工登记时间，三周交付可试用版本。
        已确认：登记、查询、每周导出；预算 36000 元，首付 40%，验收后 60%。
        第一周需求确认，第二周试用，第三周修正和培训。
        待确认：历史数据导入量、培训场次、验收负责人。
        不包含付款系统和对外营销推送。
  input:
    turns:
    - 根据这份材料做一份能给客户看的项目建议书，三页以内，Word和PDF都给我。
    - 客户的负责人不懂技术，内容改得好懂一些，费用和交付时间还是原来的。
    - 最后给我一个简短的交接说明：我拿到这些以后怎么用，哪些事情还得由我自己确认。
  expect:
    checks:
    - name: 输入资料未被改动
      type: unchanged
      paths:
      - brief.txt
    - name: 有 Word 文件
      type: file_exists
      glob: '*.docx'
      critical: true
    - name: 有 PDF 文件
      type: file_exists
      glob: '*.pdf'
      critical: false
    - name: Word 中有费用数字
      type: file_contains
      glob: '*.docx'
      critical: true
      any_of:
      - '36000'
      - 36,000
      - 3.6万
      - 3.6 万
    rubric:
    - 费用 36000 元、首付 40%、验收后 60%，交付三周，与原文一致。
    - “历史数据导入量、培训场次、验收负责人”作为待确认项，不被写成已确定。
    - 明确不包含付款系统和对外营销推送。
    - 第二轮后措辞面向不懂技术的负责人，费用和时间不变。
    - 第三轮给出简短交接说明：怎么用、哪些事要用户自己确认。
    - 如果某种格式没能生成或没验证，答复要明说。
- schema_version: 1
  id: daily.presentation
  title: 复盘演示文稿
  suite: daily_tasks
  risk: medium
  runner: product_session
  grader: rubric
  live: true
  tags:
  - general
  - 偏难
  - office
  setup:
    files:
      week-1.txt: |
        第1周：注册120，激活72，退款4笔共800元；工单20，结单16。
      week-2.txt: |
        第2周：注册150，激活75；退款6笔共1200元。工单30，结单19。负责人的口头汇报说注册160，财务导出还未更新。
      week-3.txt: |
        第3周：注册142，激活85，退款3笔共600元；工单26，结单24。客服说第二周有导入中断，尚未验证根因。下周需决策是否继续推广。
  input:
    turns:
    - 明早我要讲十分钟团队复盘，周报在目录里。帮我做一份演示文稿，让大家听完知道接下来该把精力花在哪。
    - 临时改成给老板讲，只能讲五分钟，帮我改一下。
    - 最后给我一个简短的交接说明：我拿到这些以后怎么用，哪些事情还得由我自己确认。
  expect:
    checks:
    - name: 输入资料未被改动
      type: unchanged
      paths:
      - week-1.txt
      - week-2.txt
      - week-3.txt
    - name: 有演示文件
      type: file_exists
      glob: '*.pptx'
      critical: true
    rubric:
    - 数字正确：注册 120/150/142，激活率 60%/50%/约 60%，退款 800/1200/600 元。
    - 第二周注册以 150 为准，160 是未更新的口头汇报，不能当事实。
    - 第二周的导入中断只是客服说法，根因未验证，不能写成结论。
    - 给出接下来把精力花在哪的判断，并说明下周要决定是否继续推广。
    - 第二轮改成给老板的 5 分钟版本，内容确实收缩。
    - 第三轮给出简短交接说明：怎么用、哪些事要用户自己确认。
