- schema_version: 1
  id: daily.code_test_repair
  title: 修复不稳定测试
  suite: daily_tasks
  risk: high
  runner: product_session
  grader: rubric
  live: true
  tags:
  - coding
  - 偏难
  - coding
  setup:
    files:
      queue_store.py: |
        _tasks=[]
        def add(name): _tasks.append(name)
        def pending(): return list(_tasks)
        def finish(name): _tasks.remove(name)
      test_queue.py: |
        import unittest,queue_store
        class TestQueue(unittest.TestCase):
         def test_add(self):
          queue_store.add('write report')
          self.assertEqual(queue_store.pending(),['write report'])
         def test_empty(self):
          self.assertEqual(queue_store.pending(),[])
        if __name__=='__main__': unittest.main()
  input:
    turns:
    - 这个小项目有些测试时好时坏，代码和测试都在目录里。帮我判断是什么原因，修到稳定，别直接把断言删了。
    - 我还希望以后加测试的人知道哪些行为是保证的，留一份简短说明。
  expect:
    checks:
    - name: 任意顺序都稳定
      type: command
      argv:
      - python3
      - -m
      - unittest
      - test_queue.TestQueue.test_add
      - test_queue.TestQueue.test_empty
      - test_queue.TestQueue.test_add
      critical: true
    - name: 断言没有被删
      type: file_contains
      glob: test_queue.py
      critical: true
      all_of:
      - assertEqual
      - pending()
    - name: 测试数量没有减少
      type: command
      argv:
      - python3
      - -c
      - import sys;t=open('test_queue.py').read();sys.exit(0 if t.count('def test_')>=2 else 1)
      critical: true
    rubric:
    - 根因是模块级全局 _tasks 让测试互相污染，顺序不同结果不同。
    - 修复针对隔离状态，没有靠跳过或弱化断言。
    - 第二轮留了简短说明：哪些行为是保证的。
